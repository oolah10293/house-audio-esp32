name: Lite-On CD authorized compilation and delivery gate

# Build only on a dedicated user-authorized marker commit, or explicit dispatch.
on:
  push:
    branches: [main]
    paths: ['cd-arduino/ci/authorized-build-request.txt']
  workflow_dispatch:
    inputs:
      authorization:
        description: "Enter BUILD_AND_PACKAGE after the user explicitly authorizes this release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compile-and-verify:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.authorization == 'BUILD_AND_PACKAGE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact invoked revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce marker-only authorization
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          marker=cd-arduino/ci/authorized-build-request.txt
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$marker"
          grep -qx 'BUILD_AND_PACKAGE 20261123-liteon-3-6' "$marker"
      - name: Record source revision
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --porcelain
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned Arduino ESP32 core
        run: |
          set -euo pipefail
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@2.0.14 --additional-urls "$URL"
      - name: Compile exact delivered sketch
        run: |
          set -euo pipefail
          cp cd-arduino/HouseAudioCDInput/LocalNetworkConfig.example.h cd-arduino/HouseAudioCDInput/LocalNetworkConfig.h
          printf '#pragma once\n#define CD_RELEASE_VERSION "3.6"\n#define CD_SOURCE_SHA "%s"\n' "$SOURCE_SHA" > cd-arduino/HouseAudioCDInput/src/BuildIdentity.h
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 --warnings all \
            --build-property build.partitions=default --build-property upload.maximum_size=1310720 \
            --output-dir "$RUNNER_TEMP/cd-build" cd-arduino/HouseAudioCDInput
          test -s "$RUNNER_TEMP/cd-build/HouseAudioCDInput.ino.bin"
          echo "CD_BUILD_DIR=$RUNNER_TEMP/cd-build" >> "$GITHUB_ENV"
      - name: Validate package, pinned source, and placeholder credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, subprocess, os
          source = Path('cd-arduino/HouseAudioCDInput')
          path = Path('LiteOn CD player 3.6.zip')
          app = Path(os.environ['CD_BUILD_DIR'])/'HouseAudioCDInput.ino.bin'
          assert app.is_file() and app.stat().st_size > 100000, 'Compiled binary missing'
          required = [
              'HouseAudioCDInput.ino', 'LocalNetworkConfig.h', 'partitions.csv',
              'src/HouseAudioInputTransport.h', 'src/FirmwareService.h',
              'src/BuildIdentity.h',
              'src/usb_host_msc/usbhost_driver.c',
              'src/usb_host_msc/usbhost_driver.h',
              'src/usb_host_msc/usbhost_msc_cmd.c',
              'src/usb_host_msc/usbhost_msc_cmd.h',
              'src/usb_host_msc/usbhost_scsi_cmd.c',
              'src/usb_host_msc/usbhost_scsi_cmd.h',
          ]
          files={str(p.relative_to(source)) for p in source.rglob('*') if p.is_file() and p.name!='.gitignore'}
          assert files==set(required)|{'LocalNetworkConfig.example.h'}, ('Unexpected files',sorted(files))
          assert (source/'LocalNetworkConfig.h').read_bytes()==(source/'LocalNetworkConfig.example.h').read_bytes()
          sketch=(source/'HouseAudioCDInput.ino').read_text()
          assert 'bootSession' in sketch and 'discRevision' in sketch
          assert 'friendlyName = SOURCE_DISPLAY_NAME;' in sketch
          assert 'SOURCE_DISPLAY_NAME[] = "LiteOn CD Player";' in (source/'LocalNetworkConfig.h').read_text()
          service=(source/'src/FirmwareService.h').read_text()
          assert service.index('WiFi.setSleep(false)') < service.index('WiFi.begin(')
          assert 'esp_wifi_get_ps(&ps)' in service and 'wifiPowerSave' in service
          for p in required:
              if p not in ('LocalNetworkConfig.h','src/BuildIdentity.h'):
                  assert (source/p).read_bytes()==subprocess.check_output(['git','show','HEAD:'+str(source/p)])
          assert app.read_bytes()[:1]==b'\xe9' and app.stat().st_size <= 1310720
          assert 'It does not automatically change House Music playback.' not in sketch
          source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          identity=(source/'src/BuildIdentity.h').read_text()
          assert source_sha in identity and '3.6' in identity
          manifest={p:hashlib.sha256((source/p).read_bytes()).hexdigest() for p in required}
          bin_digest=hashlib.sha256(app.read_bytes()).hexdigest()
          metadata={'source_sha':source_sha,'release_version':'3.6',
                    'arduino_core':'esp32:esp32@2.0.14','board':'esp32:esp32:XIAO_ESP32S3',
                    'partition_scheme':'default OTA-enabled 1310720 byte app slots',
                    'firmware_bin_sha256':bin_digest,'hardware_verified':False,'files_sha256':manifest}
          with ZipFile(path,'w',compression=ZIP_DEFLATED) as z:
              for p in required:z.write(source/p,'HouseAudioCDInput/'+p)
              z.write(app,'HouseAudioCDInput.ino.bin')
              z.write('cd-arduino/tools/update_cd_from_pi.py','update_cd_from_pi.py')
              z.write('cd-arduino/docs/CD_PLAYER_3_6_INSTALL.md','INSTALL.md')
              z.writestr('SOURCE_MANIFEST.json',json.dumps(metadata,indent=2)+'\n')
              z.writestr('VERSION.txt','LiteOn CD player 3.6\nSource commit: '+source_sha+
                         '\nArduino ESP32 core 2.0.14 / XIAO ESP32-S3\n'
                         'Hardware acceptance: NOT VERIFIED\n'
                         'Already running 3.5 can install 3.6 by Pi OTA; USB flash not needed.\n'
                         'Wi-Fi credentials persist in S3 NVS; no Wi-Fi secret in firmware archive.\n')
          with ZipFile(path) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('HouseAudioCDInput.ino.bin')).hexdigest()==bin_digest
              assert source_sha in z.read('HouseAudioCDInput/src/BuildIdentity.h').decode()
          metadata['zip_sha256']=hashlib.sha256(path.read_bytes()).hexdigest()
          Path('SOURCE_MANIFEST.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print('Verified package',path,'bytes',path.stat().st_size,'commit',source_sha)
          PY
      - name: Upload verified pair
        uses: actions/upload-artifact@v4
        with:
          name: LiteOn CD player 3.6
          path: |
            LiteOn CD player 3.6.zip
            SOURCE_MANIFEST.json
          if-no-files-found: error
      - name: Publish verified authorized 3.6 package
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp 'LiteOn CD player 3.6.zip' LiteOn.CD.player.3.6.zip
          sha256sum LiteOn.CD.player.3.6.zip > LiteOn.CD.player.3.6.sha256
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          path=Path('LiteOn.CD.player.3.6.zip')
          meta=json.loads(Path('SOURCE_MANIFEST.json').read_text())
          assert hashlib.sha256(path.read_bytes()).hexdigest()==meta['zip_sha256']
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              internal=json.loads(z.read('SOURCE_MANIFEST.json'))
              assert internal['source_sha']==meta['source_sha']
              for p,d in internal['files_sha256'].items():
                  assert hashlib.sha256(z.read('HouseAudioCDInput/'+p)).hexdigest()==d
              assert hashlib.sha256(z.read('HouseAudioCDInput.ino.bin')).hexdigest()==internal['firmware_bin_sha256']
          PY
          gh release create liteon-cd-3.6 LiteOn.CD.player.3.6.zip LiteOn.CD.player.3.6.sha256 SOURCE_MANIFEST.json --target "$SOURCE_SHA" --title "LiteOn CD player 3.6" --notes "Source registration name changed to LiteOn CD Player only. Lossless WAV, Wi-Fi and all CD/USB behavior unchanged. Built with Arduino ESP32 2.0.14; hardware acceptance pending. 3.5 remains rollback."
