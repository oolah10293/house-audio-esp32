name: Validate Bose sub DSP

on:
  push:
    branches: [bose-sub-ha-controls, bose-sub-auto-standby]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native JSON test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libcjson-dev

      - name: Native runtime DSP, Bose policy and Pi contract checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_sub_filter.cpp -o /tmp/test_sub_filter
          /tmp/test_sub_filter
          g++ -std=c++17 -Os -flto -fno-lto -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--wrap=dsp_processor_worker -Itests/stubs tests/test_hook.cpp tests/mock_upstream.cpp components/house_sub_dsp/house_sub_dsp.cpp -o /tmp/test_hook
          /tmp/test_hook
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_bose_controller.cpp -o /tmp/test_bose_controller
          /tmp/test_bose_controller
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -I/usr/include/cjson tests/test_pi_contract.cpp -lcjson -o /tmp/test_pi_contract
          /tmp/test_pi_contract

      - name: Install matching ESPHome release
        run: python -m pip install esphome==2026.4.0

      - name: Compile exact shipped XIAO S3 firmware
        run: |
          cat > firmware/secrets.yaml <<'EOF'
          wifi_ssid: compile-only-network
          wifi_password: compile-only-password
          EOF
          set -o pipefail
          esphome compile firmware/bose-subwoofer-prototype.yaml 2>&1 | tee /tmp/bose-build.log

      - name: Verify exact firmware, entities and real DSP call sites
        run: python tests/check_pr14389_build.py

      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bose-sub-v0.1.0-build
          path: |
            /tmp/bose-build.log
            firmware/bose-subwoofer-prototype.yaml
            firmware/.esphome/build/bose-sub/.pioenvs/bose-sub/firmware.elf
          if-no-files-found: ignore
