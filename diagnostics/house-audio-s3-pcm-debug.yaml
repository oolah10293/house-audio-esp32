# Phase 2 audio-path diagnostic firmware for Seeed XIAO ESP32-S3.
# Keep Wi-Fi credentials in ESPHome secrets/local config.

esphome:
  name: house-audio-s3-test
  friendly_name: House Audio S3 Test

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

ota:
  - platform: esphome

network:
  enable_ipv6: false

external_components:
  - source: github://oolah10293/house-audio-esp32@main
    components: [snapclient]
    refresh: 0s

i2s_audio:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5

snapclient:
  hostname: 192.168.1.12
  port: 1704
  name: House Audio S3 Test
  i2s_dout_pin: GPIO6
