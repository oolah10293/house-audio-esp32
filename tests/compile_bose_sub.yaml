# Integration build: identical to the delivered YAML except Wi-Fi secrets
# and the local checkout source for the DSP component under test.
substitutions:
  name: bose-sub
  friendly_name: Bose Sub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          constexpr uint32_t BIT_US = 208;
          auto line_low = [&]() { id(bose_bus_tx).turn_on(); };
          auto line_release = [&]() { id(bose_bus_tx).turn_off(); };
          auto send_byte = [&](uint8_t value) {
            line_low();
            delayMicroseconds(BIT_US);
            for (int bit = 0; bit < 8; bit++) {
              if (value & (1 << bit)) line_release();
              else line_low();
              delayMicroseconds(BIT_US);
            }
            line_release();
            delayMicroseconds(BIT_US);
          };
          auto send_cmd = [&](const uint8_t *data, size_t len) {
            for (size_t i = 0; i < len; i++) send_byte(data[i]);
            delay(30);
          };
          const uint8_t wake[]   = {0x01, 0x00, 0x00, 0x01};
          const uint8_t analog[] = {0x0D, 0x00, 0x02, 0x0F};
          const uint8_t stream[] = {0x0E, 0x00, 0x00, 0x00, 0x0E};
          const uint8_t volume[] = {0x02, 0x00, 0x0C, 0x0E};
          line_release();
          delay(50);
          ESP_LOGI("bose", "TX wake #1");
          send_cmd(wake, sizeof(wake));
          delay(150);
          ESP_LOGI("bose", "TX wake #2");
          send_cmd(wake, sizeof(wake));
          ESP_LOGI("bose", "TX analog input select");
          send_cmd(analog, sizeof(analog));
          ESP_LOGI("bose", "TX stream setup");
          send_cmd(stream, sizeof(stream));
          ESP_LOGI("bose", "TX attenuation 12");
          send_cmd(volume, sizeof(volume));
          ESP_LOGI("bose", "Bose initialization sequence complete");

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    log_level: INFO

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: compile-only-network
  password: compile-only-password
  power_save_mode: none
  post_connect_roaming: false

ota:
  - platform: esphome

network:
  enable_ipv6: false

external_components:
  - source: github://luar123/esphome@4d3280bd35fdd970e628a22197f19ab0fded1a39
    components: [snapclient]
    refresh: 0s
  - source:
      type: local
      path: ../components
    components: [house_sub_dsp]

house_sub_dsp:
  lowpass_hz: 90.0

i2s_audio:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5

media_player:
  - platform: snapclient
    id: house_renderer
    hostname: 192.168.1.12
    port: 1704
    name: ${friendly_name}
    i2s_dout_pin: GPIO6

output:
  - platform: gpio
    id: bose_bus_tx
    pin:
      number: GPIO43
      inverted: true
      mode:
        output: true
        open_drain: true

uart:
  id: bose_bus_rx
  rx_pin: GPIO44
  baud_rate: 4800
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
  rx_timeout: 1
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');
