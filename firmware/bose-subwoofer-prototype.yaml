# Bose Sub — Snapclient PR #14389 + live Home Assistant tuning controls.
#
# Existing wiring, unchanged:
#   PCM5102A LCK -> XIAO D3 / GPIO4
#   PCM5102A BCK -> XIAO D4 / GPIO5
#   PCM5102A DIN -> XIAO D5 / GPIO6
#   XIAO D6 / GPIO43 -> Bose pin 13 through 1k
#   XIAO D7 / GPIO44 -> Bose pin 13 through a separate 1k
#   XIAO GND -> Bose pin 7
#   220 ohms between Bose pins 4 and 7
#   PCM5102A L OUT -> Bose pin 9
#   PCM5102A GND -> Bose pin 8
#
# Never connect Bose pin 1 (~28.8 V measured) directly to the XIAO.

substitutions:
  name: bose-sub
  friendly_name: Bose Sub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: -100
    then:
      # Apply restored Home Assistant settings before audio begins.
      - lambda: |-
          id(sub_dsp).set_lowpass_hz(id(sub_lowpass).state);
          id(sub_dsp).set_lowcut_hz(id(sub_lowcut).state);
          id(sub_dsp).set_phase_inverted(id(sub_phase_invert).state);
          id(sub_dsp).set_crossover_bypass(id(sub_crossover_bypass).state);
          id(bose_ready) = false;

      - delay: 3s

      # Existing, proven Bose wake/input/stream sequence. The fixed 0x0C
      # attenuation byte is replaced by the restored HA attenuation value.
      - lambda: |-
          constexpr uint32_t BIT_US = 208;

          auto line_low = [&]() {
            id(bose_bus_tx).turn_on();
          };
          auto line_release = [&]() {
            id(bose_bus_tx).turn_off();
          };

          auto send_byte = [&](uint8_t value) {
            line_low();
            delayMicroseconds(BIT_US);

            for (int bit = 0; bit < 8; bit++) {
              if (value & (1 << bit))
                line_release();
              else
                line_low();

              delayMicroseconds(BIT_US);
            }

            line_release();
            delayMicroseconds(BIT_US);
          };

          auto send_cmd = [&](const uint8_t *data, size_t len) {
            for (size_t i = 0; i < len; i++)
              send_byte(data[i]);

            delay(30);
          };

          int attenuation =
              static_cast<int>(id(bose_attenuation).state + 0.5f);
          if (attenuation < 0) attenuation = 0;
          if (attenuation > 40) attenuation = 40;

          const uint8_t att = static_cast<uint8_t>(attenuation);
          const uint8_t wake[]   = {0x01, 0x00, 0x00, 0x01};
          const uint8_t analog[] = {0x0D, 0x00, 0x02, 0x0F};
          const uint8_t stream[] = {0x0E, 0x00, 0x00, 0x00, 0x0E};
          const uint8_t volume[] = {
            0x02, 0x00, att, static_cast<uint8_t>(0x02 ^ att)
          };

          line_release();
          delay(50);

          ESP_LOGI("bose", "TX wake #1");
          send_cmd(wake, sizeof(wake));
          delay(150);

          ESP_LOGI("bose", "TX wake #2");
          send_cmd(wake, sizeof(wake));

          ESP_LOGI("bose", "TX analog input select");
          send_cmd(analog, sizeof(analog));

          ESP_LOGI("bose", "TX stream setup");
          send_cmd(stream, sizeof(stream));

          ESP_LOGI("bose", "TX attenuation %u", att);
          send_cmd(volume, sizeof(volume));

          id(bose_ready) = true;
          ESP_LOGI("bose", "Bose initialization sequence complete");

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    log_level: INFO

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false

# Expose only the controls that actually work. Losing Home Assistant must not
# reboot an otherwise-working audio renderer.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

network:
  enable_ipv6: false

external_components:
  # Newer ESPHome Snapclient PR #14389.
  - source: github://luar123/esphome@4d3280bd35fdd970e628a22197f19ab0fded1a39
    components: [snapclient]
    refresh: 0s

  # Runtime mono/crossover adapter, pinned to the validated revision.
  - source: github://oolah10293/house-audio-esp32@6fee4c6b3e0fbc3c9bb61ebce5ed67fd5a871278
    components: [house_sub_dsp]
    refresh: 0s

# Always does (L+R)/2 mono. The settings below are startup defaults; restored
# Home Assistant values replace them during boot.
house_sub_dsp:
  id: sub_dsp
  lowpass_hz: 90.0
  lowcut_hz: 0.0
  phase_inverted: false
  crossover_bypass: false

i2s_audio:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5

media_player:
  - platform: snapclient
    id: house_renderer
    hostname: 192.168.1.12
    port: 1704
    name: ${friendly_name}
    i2s_dout_pin: GPIO6

    # PR #14389's HA-facing volume/mute write methods are not implemented.
    # Keep the renderer running but hide those dead controls from HA.
    internal: true

globals:
  - id: bose_ready
    type: bool
    restore_value: no
    initial_value: 'false'

# Restart-mode scripts debounce HA sliders: dragging a control sends/applies only
# the final value after 150 ms instead of hammering the Bose bus or repeatedly
# resetting filter state.
script:
  - id: bose_send_attenuation
    mode: restart
    parameters:
      attenuation: int
    then:
      - delay: 150ms
      - lambda: |-
          if (!id(bose_ready))
            return;

          if (attenuation < 0) attenuation = 0;
          if (attenuation > 40) attenuation = 40;

          constexpr uint32_t BIT_US = 208;
          auto line_low = [&]() {
            id(bose_bus_tx).turn_on();
          };
          auto line_release = [&]() {
            id(bose_bus_tx).turn_off();
          };

          auto send_byte = [&](uint8_t value) {
            line_low();
            delayMicroseconds(BIT_US);

            for (int bit = 0; bit < 8; bit++) {
              if (value & (1 << bit))
                line_release();
              else
                line_low();

              delayMicroseconds(BIT_US);
            }

            line_release();
            delayMicroseconds(BIT_US);
          };

          const uint8_t att = static_cast<uint8_t>(attenuation);
          const uint8_t command[] = {
            0x02, 0x00, att, static_cast<uint8_t>(0x02 ^ att)
          };

          // Guarantee at least one idle bit before the start bit.
          line_release();
          delayMicroseconds(BIT_US);

          ESP_LOGI("bose", "TX attenuation %u", att);
          for (uint8_t value : command)
            send_byte(value);

          line_release();

      # Leave time for the Bose ACK without blocking ESPHome's main loop.
      - delay: 30ms

  - id: sub_apply_lowpass
    mode: restart
    parameters:
      cutoff_hz: float
    then:
      - delay: 150ms
      - lambda: |-
          id(sub_dsp).set_lowpass_hz(cutoff_hz);

  - id: sub_apply_lowcut
    mode: restart
    parameters:
      cutoff_hz: float
    then:
      - delay: 150ms
      - lambda: |-
          id(sub_dsp).set_lowcut_hz(cutoff_hz);

number:
  # Native Bose attenuation: higher number = quieter. This is not a percentage.
  - platform: template
    id: bose_attenuation
    name: Bose Hardware Attenuation
    icon: mdi:volume-minus
    entity_category: config
    min_value: 0
    max_value: 40
    step: 1
    initial_value: 12
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - script.execute:
          id: bose_send_attenuation
          attenuation: !lambda 'return static_cast<int>(x + 0.5f);'

  - platform: template
    id: sub_lowpass
    name: Sub Low-Pass
    icon: mdi:filter
    entity_category: config
    unit_of_measurement: Hz
    min_value: 60
    max_value: 160
    step: 1
    initial_value: 90
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - script.execute:
          id: sub_apply_lowpass
          cutoff_hz: !lambda 'return x;'

  # Values are 0, 10, 20, 30, 40 or 50 Hz. Zero disables the high-pass.
  - platform: template
    id: sub_lowcut
    name: Sub Low-Cut (0 = Off)
    icon: mdi:filter-outline
    entity_category: config
    unit_of_measurement: Hz
    min_value: 0
    max_value: 50
    step: 10
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - script.execute:
          id: sub_apply_lowcut
          cutoff_hz: !lambda 'return x;'

switch:
  - platform: template
    id: sub_phase_invert
    name: Sub Phase 180 Degrees
    icon: mdi:sine-wave
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(sub_dsp).set_phase_inverted(true);'
    turn_off_action:
      - lambda: 'id(sub_dsp).set_phase_inverted(false);'

  # Bypasses both crossover filters for comparison. Mono summing and the
  # selected 0/180-degree phase remain active.
  - platform: template
    id: sub_crossover_bypass
    name: Sub Crossover Bypass
    icon: mdi:filter-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(sub_dsp).set_crossover_bypass(true);'
    turn_off_action:
      - lambda: 'id(sub_dsp).set_crossover_bypass(false);'

output:
  - platform: gpio
    id: bose_bus_tx
    pin:
      number: GPIO43
      inverted: true
      mode:
        output: true
        open_drain: true

uart:
  id: bose_bus_rx
  rx_pin: GPIO44
  baud_rate: 4800
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
  rx_timeout: 1
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');
