esphome:
  name: "house-audio-s3-1"
  friendly_name: Basement stereo
  min_version: 2026.3.0

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none

  manual_ip:
    static_ip: 192.168.1.117
    gateway: 192.168.1.1
    subnet: 255.255.255.0

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

network:
  enable_ipv6: false

external_components:
  - source: github://oolah10293/esphome@7d84414a54235a215fd2420bd6a8ac00156d488e
    components: [snapclient]
    refresh: 0s

i2s_audio:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5

media_player:
  - platform: snapclient
    hostname: 192.168.1.12
    port: 1704
    name: Basement stereo
    i2s_dout_pin: GPIO6