esphome:
  name: "house-audio-c6-4"
  friendly_name: Emerson Radio
  min_version: 2026.3.0

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf
    version: recommended

logger:
  level: WARN
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  post_connect_roaming: false

  manual_ip:
    static_ip: 192.168.1.179
    gateway: 192.168.1.1
    subnet: 255.255.255.0

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

network:
  enable_ipv6: false

external_components:
  - source: github://oolah10293/house-audio-esp32@19e4679b1b8d96c5416f94836d54300e6f0a25d8
    components: [snapclient]
    refresh: 0s

i2s_audio:
  i2s_lrclk_pin: GPIO21
  i2s_bclk_pin: GPIO22

media_player:
  - platform: snapclient
    hostname: 192.168.1.12
    port: 1704
    name: Emerson Radio
    i2s_dout_pin: GPIO23
